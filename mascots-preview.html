<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MOWES / TOWES — Mascot pair (preview)</title>
<style>
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ min-height:100vh; background:linear-gradient(180deg,#eef0ff,#e6e9ff); display:flex; flex-direction:column;
    align-items:center; justify-content:center; font-family:-apple-system,"SF Pro Rounded","Segoe UI",system-ui,sans-serif; padding:24px; }
  .tag{ font-size:12px; font-weight:800; letter-spacing:.16em; text-transform:uppercase; color:#a9aede; }
  h1{ color:#5b6cff; font-size:26px; font-weight:900; margin:6px 0 20px; text-align:center; }
  .pair{ display:flex; gap:18px; }
  .m{ background:#fff; border-radius:22px; padding:16px 14px 14px; box-shadow:0 12px 34px rgba(60,64,102,.12); text-align:center; width:150px; }
  .m svg{ width:120px; height:120px; }
  .m .name{ font-size:18px; font-weight:900; margin-top:4px; }
  .m .who{ font-size:11.5px; font-weight:700; color:#8a90a8; margin-top:2px; }
  .m.a .name{ color:#e8862a; } .m.b .name{ color:#7a5bff; }
  .note{ margin-top:20px; color:#6a7088; font-size:13px; font-weight:600; text-align:center; max-width:340px; line-height:1.5; }
  .note b{ color:#3a4066; }
</style>
</head>
<body>
  <div class="tag">ERMES · mascot pair</div>
  <h1>Meet the pair 👋</h1>
  <div class="pair">

    <div class="m a">
      <svg viewBox="0 0 100 100" aria-label="MOWES character">
        <ellipse cx="50" cy="94" rx="26" ry="5" fill="#c9cdf0"/>
        <path d="M42 92 q-3 -14 0 -24 l8 0 q1 12 -2 24z" fill="#5b64b8"/>
        <path d="M52 92 q3 -14 2 -24 l7 0 q2 12 1 24z" fill="#6b74c9"/>
        <path d="M40 68 q-3 -22 10 -24 q13 2 10 24z" fill="#ff9d3d"/>
        <path d="M43 52 q-10 -12 -13 -23" stroke="#ffb15e" stroke-width="6" fill="none" stroke-linecap="round"/>
        <path d="M57 52 q10 -12 13 -23" stroke="#ffb15e" stroke-width="6" fill="none" stroke-linecap="round"/>
        <circle cx="50" cy="38" r="11" fill="#f0c39a"/>
        <path d="M39 37 q0 -14 11 -14 q11 0 11 14 q-4 -6 -11 -6 q-7 0 -11 6z" fill="#4d4038"/>
        <circle cx="46" cy="37.5" r="1.6" fill="#3a2f28"/><circle cx="54" cy="37.5" r="1.6" fill="#3a2f28"/>
        <path d="M43.5 34.4 l2 0.6 M56.5 34.4 l-2 0.6" stroke="#4d4038" stroke-width="1" stroke-linecap="round"/>
        <path d="M45 42 q5 5 10 0" stroke="#8a6a50" stroke-width="1.8" fill="none" stroke-linecap="round"/>
        <g fill="#ffcf8f"><circle cx="26" cy="30" r="2"/><circle cx="74" cy="30" r="2"/></g>
      </svg>
      <div class="name">MOWES</div>
      <div class="who">the everyday mover</div>
    </div>

    <div class="m b">
      <svg viewBox="0 0 100 100" aria-label="TOWES character">
        <ellipse cx="50" cy="94" rx="26" ry="5" fill="#c9cdf0"/>
        <!-- legs -->
        <path d="M42 92 q-3 -14 0 -24 l8 0 q1 12 -2 24z" fill="#5b64b8"/>
        <path d="M52 92 q3 -14 2 -24 l7 0 q2 12 1 24z" fill="#6b74c9"/>
        <!-- pink sport dress (flared) -->
        <path d="M37 72 q-1 -27 13 -29 q14 2 13 29z" fill="#ff6fa5"/>
        <path d="M50 44 l0 27" stroke="#ff9ac1" stroke-width="1.3" opacity="0.6"/>
        <!-- arms up (skin) -->
        <path d="M44 53 q-10 -12 -13 -23" stroke="#eeb98f" stroke-width="6" fill="none" stroke-linecap="round"/>
        <path d="M56 53 q10 -12 13 -23" stroke="#eeb98f" stroke-width="6" fill="none" stroke-linecap="round"/>
        <!-- high bun -->
        <ellipse cx="50" cy="17" rx="6.5" ry="5.5" fill="#6b4f3a"/>
        <path d="M47 20 q3 -5 6 0" stroke="#c99a63" stroke-width="1.1" fill="none" stroke-linecap="round"/>
        <!-- face -->
        <circle cx="50" cy="38" r="11" fill="#f3c9a2"/>
        <!-- hair pulled up over the crown -->
        <path d="M39.5 35 q-1 -16 10.5 -16 q11.5 0 10.5 16 q-3 -6 -10.5 -6 q-7.5 0 -10.5 6z" fill="#6b4f3a"/>
        <!-- highlights -->
        <path d="M43 30 q3 -7 8 -6" stroke="#c99a63" stroke-width="1.3" fill="none" stroke-linecap="round"/>
        <path d="M52 25 q4 -2 6 1" stroke="#c99a63" stroke-width="1.2" fill="none" stroke-linecap="round"/>
        <!-- pink hair tie -->
        <rect x="46" y="21" width="8" height="3.4" rx="1.7" fill="#ff6fa5"/>
        <!-- eyes with lashes -->
        <ellipse cx="46" cy="37.5" rx="1.5" ry="1.9" fill="#3a2f28"/>
        <ellipse cx="54" cy="37.5" rx="1.5" ry="1.9" fill="#3a2f28"/>
        <path d="M43.6 35.4 l-1.6 -1 M43.9 37 l-1.8 -0.2" stroke="#3a2f28" stroke-width="0.9" stroke-linecap="round"/>
        <path d="M56.4 35.4 l1.6 -1 M56.1 37 l1.8 -0.2" stroke="#3a2f28" stroke-width="0.9" stroke-linecap="round"/>
        <!-- rosy cheeks -->
        <circle cx="42.5" cy="41.5" r="2.1" fill="#ff9ac1" opacity="0.45"/>
        <circle cx="57.5" cy="41.5" r="2.1" fill="#ff9ac1" opacity="0.45"/>
        <!-- smile -->
        <path d="M45 42 q5 5 10 0" stroke="#9a6f52" stroke-width="1.8" fill="none" stroke-linecap="round"/>
        <g fill="#ffc0dd"><circle cx="26" cy="30" r="2"/><circle cx="74" cy="30" r="2"/></g>
      </svg>
      <div class="name">TOWES</div>
      <div class="who">the wife / the coach</div>
    </div>

  </div>
  <div class="note">A matching <b>mascot pair</b>, 100% ours — hand-drawn, no licensing. Swap the names either way. We can pose them, resize them, and reuse them across the app and promos.</div>
</body>
</html>
