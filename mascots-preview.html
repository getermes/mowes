<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MOWES / TOWES — Mascot pair (preview)</title>
<style>
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ min-height:100vh; background:linear-gradient(180deg,#eef0ff,#e6e9ff); display:flex; flex-direction:column;
    align-items:center; justify-content:center; font-family:-apple-system,"SF Pro Rounded","Segoe UI",system-ui,sans-serif; padding:24px; }
  .tag{ font-size:12px; font-weight:800; letter-spacing:.16em; text-transform:uppercase; color:#a9aede; }
  h1{ color:#5b6cff; font-size:26px; font-weight:900; margin:6px 0 20px; text-align:center; }
  .pair{ display:flex; gap:18px; }
  .m{ background:#fff; border-radius:22px; padding:16px 14px 14px; box-shadow:0 12px 34px rgba(60,64,102,.12); text-align:center; width:150px; }
  .m svg{ width:120px; height:120px; }
  .m .name{ font-size:18px; font-weight:900; margin-top:4px; }
  .m .who{ font-size:11.5px; font-weight:700; color:#8a90a8; margin-top:2px; }
  .m.a .name{ color:#e8862a; } .m.b .name{ color:#7a5bff; }
  .note{ margin-top:20px; color:#6a7088; font-size:13px; font-weight:600; text-align:center; max-width:340px; line-height:1.5; }
  .note b{ color:#3a4066; }
</style>
</head>
<body>
  <div class="tag">ERMES · mascot pair</div>
  <h1>Meet the pair 👋</h1>
  <div class="pair">

    <div class="m a">
      <svg viewBox="0 0 100 100" aria-label="MOWES character">
        <ellipse cx="50" cy="94" rx="26" ry="5" fill="#c9cdf0"/>
        <path d="M42 92 q-3 -14 0 -24 l8 0 q1 12 -2 24z" fill="#5b64b8"/>
        <path d="M52 92 q3 -14 2 -24 l7 0 q2 12 1 24z" fill="#6b74c9"/>
        <path d="M40 68 q-3 -22 10 -24 q13 2 10 24z" fill="#ff9d3d"/>
        <path d="M43 52 q-10 -12 -13 -23" stroke="#ffb15e" stroke-width="6" fill="none" stroke-linecap="round"/>
        <path d="M57 52 q10 -12 13 -23" stroke="#ffb15e" stroke-width="6" fill="none" stroke-linecap="round"/>
        <circle cx="50" cy="38" r="11" fill="#f0c39a"/>
        <path d="M39 37 q0 -14 11 -14 q11 0 11 14 q-4 -6 -11 -6 q-7 0 -11 6z" fill="#4d4038"/>
        <path d="M45 41 q5 5 10 0" stroke="#8a6a50" stroke-width="1.8" fill="none" stroke-linecap="round"/>
        <g fill="#ffcf8f"><circle cx="26" cy="30" r="2"/><circle cx="74" cy="30" r="2"/></g>
      </svg>
      <div class="name">MOWES</div>
      <div class="who">the everyday mover</div>
    </div>

    <div class="m b">
      <svg viewBox="0 0 100 100" aria-label="TOWES character">
        <ellipse cx="50" cy="94" rx="26" ry="5" fill="#c9cdf0"/>
        <path d="M42 92 q-3 -14 0 -24 l8 0 q1 12 -2 24z" fill="#5b64b8"/>
        <path d="M52 92 q3 -14 2 -24 l7 0 q2 12 1 24z" fill="#6b74c9"/>
        <!-- long hair behind -->
        <path d="M34 42 q-2 -24 16 -24 q18 0 16 24 q-1 12 -4 18 l-4 -1 q3 -12 -1 -22 q-7 -6 -14 0 q-4 10 -1 22 l-4 1 q-3 -6 -4 -18z" fill="#5a4636"/>
        <!-- purple dress/top -->
        <path d="M39 70 q-2 -24 11 -26 q13 2 11 26z" fill="#7a5bff"/>
        <!-- arms up (skin) -->
        <path d="M43 52 q-10 -12 -13 -23" stroke="#eeb98f" stroke-width="6" fill="none" stroke-linecap="round"/>
        <path d="M57 52 q10 -12 13 -23" stroke="#eeb98f" stroke-width="6" fill="none" stroke-linecap="round"/>
        <!-- face -->
        <circle cx="50" cy="38" r="11" fill="#f3c9a2"/>
        <!-- bangs -->
        <path d="M40 34 q10 -9 20 0 q-3 -9 -10 -9 q-7 0 -10 9z" fill="#5a4636"/>
        <path d="M45 41 q5 5 10 0" stroke="#9a6f52" stroke-width="1.8" fill="none" stroke-linecap="round"/>
        <g fill="#c9b0ff"><circle cx="26" cy="30" r="2"/><circle cx="74" cy="30" r="2"/></g>
      </svg>
      <div class="name">TOWES</div>
      <div class="who">the wife / the coach</div>
    </div>

  </div>
  <div class="note">A matching <b>mascot pair</b>, 100% ours — hand-drawn, no licensing. Swap the names either way. We can pose them, resize them, and reuse them across the app and promos.</div>
</body>
</html>
