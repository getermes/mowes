<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MOWES Promo — From Download to Done</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,600;1,9..144,700;1,9..144,900&family=Playfair+Display:ital,wght@1,700;1,900&display=swap" rel="stylesheet">
<style>
  :root{
    /* Studio backdrop (adapts light/dark). The phone SCREEN always shows the
       app's true light look — that's authentic to how MOWES really appears. */
    --bg1:#e9ebfb; --bg2:#f4f1fb;
    --stage:#ffffff; --stage-edge:rgba(30,26,64,.10);
    --ink:#20233f; --muted:#6a6f8c;
    --indigo:#5b6cff; --violet:#7a5bff; --gold:#f2b23c; --green:#2fa36b;
    --track:rgba(32,35,63,.16); --track-fill:#5b6cff;
    --chip-bg:rgba(91,108,255,.10); --chip-ink:#4a55d6;
    --shadow:0 30px 70px -30px rgba(43,38,110,.55);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg1:#141530; --bg2:#0e0f22;
      --stage:#1a1c38; --stage-edge:rgba(255,255,255,.08);
      --ink:#eceeffe; --muted:#a2a7c8;
      --track:rgba(255,255,255,.18); --track-fill:#8b98ff;
      --chip-bg:rgba(139,152,255,.14); --chip-ink:#b9c1ff;
      --shadow:0 30px 80px -30px rgba(0,0,0,.8);
    }
  }
  :root[data-theme="light"]{
    --bg1:#e9ebfb; --bg2:#f4f1fb; --stage:#ffffff; --stage-edge:rgba(30,26,64,.10);
    --ink:#20233f; --muted:#6a6f8c; --track:rgba(32,35,63,.16); --track-fill:#5b6cff;
    --chip-bg:rgba(91,108,255,.10); --chip-ink:#4a55d6; --shadow:0 30px 70px -30px rgba(43,38,110,.55);
  }
  :root[data-theme="dark"]{
    --bg1:#141530; --bg2:#0e0f22; --stage:#1a1c38; --stage-edge:rgba(255,255,255,.08);
    --ink:#eceeff; --muted:#a2a7c8; --track:rgba(255,255,255,.18); --track-fill:#8b98ff;
    --chip-bg:rgba(139,152,255,.14); --chip-ink:#b9c1ff; --shadow:0 30px 80px -30px rgba(0,0,0,.8);
  }

  *{ box-sizing:border-box; }
  body,.wrap{ margin:0; }
  .wrap{
    min-height:100vh; display:flex; flex-direction:column; align-items:center;
    gap:18px; padding:22px 16px 30px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    color:var(--ink);
    background:radial-gradient(120% 90% at 50% -10%, var(--bg2), var(--bg1));
  }
  .kicker{ display:flex; align-items:center; gap:9px; font-weight:800; letter-spacing:.14em;
    text-transform:uppercase; font-size:12px; color:var(--muted); }
  .kicker b{ color:var(--indigo); letter-spacing:.02em; }

  /* ---- The "video" frame: a phone with story progress on top ---- */
  .player{ width:100%; max-width:392px; display:flex; flex-direction:column; gap:14px; }
  .bars{ display:flex; gap:5px; padding:0 4px; }
  .bar{ flex:1; height:4px; border-radius:99px; background:var(--track); overflow:hidden; }
  .bar > i{ display:block; height:100%; width:0; border-radius:99px; background:var(--track-fill); }

  .phone{
    position:relative; width:100%; aspect-ratio:9/17.4; border-radius:44px;
    background:linear-gradient(160deg,#2b2d55,#191a30); padding:11px;
    box-shadow:var(--shadow); overflow:hidden;
  }
  .screen{
    position:relative; width:100%; height:100%; border-radius:34px; overflow:hidden;
    background:radial-gradient(130% 80% at 50% -8%, #eef0ff, #e3e6fb 60%, #dfe3fb);
    color:#20233f;
  }
  /* Every slide stacked; only .on is shown */
  .slide{ position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center;
    padding:200px 22px 30px; gap:14px; opacity:0; transform:scale(1.03);
    pointer-events:none; }
  .slide.on{ opacity:1; transform:none; pointer-events:auto;
    transition:opacity .5s ease, transform .6s cubic-bezier(.2,.7,.2,1); }
  @media (prefers-reduced-motion: reduce){ .slide,.slide.on{ transition:opacity .3s ease; transform:none; } }

  /* Baked-in on-screen caption (part of the "video") */
  .cap{ position:absolute; left:0; right:0; top:15%; bottom:auto; padding:0 22px;
    display:flex; flex-direction:column; align-items:center; gap:28px; }
  .cap .big{ position:relative; font-family:'Fraunces','Playfair Display',Georgia,serif; font-style:italic;
    font-size:30px; font-weight:900; line-height:1.1; letter-spacing:.2px; text-wrap:balance; color:#20233f;
    text-shadow:-1.3px -1.3px 0 #b4530f, 1.3px -1.3px 0 #b4530f, -1.3px 1.3px 0 #b4530f, 1.3px 1.3px 0 #b4530f, 0 3px 9px rgba(120,45,18,.5);
    filter:drop-shadow(0 8px 14px rgba(120,45,18,.28)); will-change:transform;
    animation:capFloat 4s ease-in-out infinite; }
  /* Soft glowing "cloud" the text floats on. */
  .cap .big::before{ content:''; position:absolute; z-index:-1; left:50%; top:38%; transform:translate(-50%,-50%);
    width:172%; height:255%; border-radius:50%; pointer-events:none;
    background:radial-gradient(ellipse at center, rgba(234,88,12,.88) 0%, rgba(254,215,170,.94) 28%, rgba(249,115,22,.58) 56%, rgba(194,65,12,.20) 72%, transparent 82%);
    filter:blur(30px); animation:cloudPulse 5s ease-in-out infinite; }
  @keyframes cloudPulse{ 0%,100%{ opacity:.95; transform:translate(-50%,-54%) scale(1.02);} 50%{ opacity:1; transform:translate(-50%,-46%) scale(1.16);} }
  @media (prefers-reduced-motion: reduce){ .cap .big::before{ animation:none; } }
  @keyframes capFloat{ 0%,100%{ transform:translateY(6px) rotate(-.6deg);} 50%{ transform:translateY(-16px) rotate(.6deg);} }
  .cap .big .w{ display:inline-block; opacity:0; transform:translateY(12px) scale(.9) rotate(-2deg);
    color:#ffffff;
    transition:opacity .34s ease, transform .46s cubic-bezier(.18,1.35,.35,1); }
  .slide.on .cap .big .w{ opacity:1; transform:none; }
  @media (prefers-reduced-motion: reduce){ .cap .big .w{ opacity:1; transform:none; transition:none; } .cap .big{ animation:none; } }
  .cap .pill{ position:relative; z-index:2; font-size:12.5px; font-weight:800; letter-spacing:.02em; color:#7c2d12; opacity:0;
    background:linear-gradient(135deg,#fed7aa,#fdba74);
    padding:6px 13px; border-radius:99px; box-shadow:0 6px 16px -5px rgba(194,65,12,.55), 0 0 0 2.5px #fff; }
  .cap .pill{ display:none; }   /* pills removed from all slides for a cleaner look */
  /* Tappable "open the app" button on the final slide */
  .cap .cta-btn{ display:inline-block; margin-top:18px; text-decoration:none; position:relative; z-index:3;
    font-size:15px; font-weight:800; letter-spacing:.01em; color:#fff;
    background:linear-gradient(135deg,#f97316,#c2410c); padding:13px 22px; border-radius:99px;
    box-shadow:0 8px 20px -6px rgba(194,65,12,.6), 0 0 0 2.5px #fff;
    opacity:0; transform:translateY(10px) scale(.92);
    transition:opacity .4s ease, transform .5s cubic-bezier(.2,1.35,.4,1); transition-delay:1.1s; }
  .slide.on .cap .cta-btn{ opacity:1; transform:none; animation:ctaPulse 1.8s ease-in-out 1.7s infinite; }
  .cap .cta-btn:active{ transform:scale(.97); }
  @keyframes ctaPulse{ 0%,100%{ transform:scale(1);} 50%{ transform:scale(1.05);} }
  .slide.on .cap .pill{ animation:pillPop .5s cubic-bezier(.2,1.35,.4,1) both; }
  @keyframes pillPop{ 0%{ opacity:0; transform:scale(.55) translateY(8px);} 55%{ opacity:1; transform:scale(1.1);} 100%{ opacity:1; transform:scale(1);} }
  .eyebrow{ position:absolute; top:15px; left:0; right:0; text-align:center;
    font-size:11px; font-weight:800; letter-spacing:.16em; text-transform:uppercase; color:#8188b8; }

  /* ---------- scene bits (reused mock UI) ---------- */
  .logo-wrap{ display:flex; flex-direction:column; align-items:center; gap:6px; }
  .logo{ font-size:46px; font-weight:900; letter-spacing:-.02em;
    background:linear-gradient(120deg,var(--indigo),var(--violet)); -webkit-background-clip:text;
    background-clip:text; color:transparent; position:relative; }
  .logo .fist{ position:absolute; top:-26px; left:50%; transform:translateX(-50%); font-size:26px; }
  .barbell{ font-size:15px; letter-spacing:.5em; color:var(--gold); }
  .tag{ font-size:13px; color:#6a7099; font-weight:600; }
  .badge{ font-size:12px; font-weight:800; color:#3f8f66; background:rgba(47,163,107,.12);
    border:1px solid rgba(47,163,107,.3); padding:6px 12px; border-radius:99px; }

  .btn{ font-weight:800; color:#fff; border-radius:16px; padding:14px 22px; font-size:16px;
    background:linear-gradient(135deg,var(--indigo),var(--violet));
    box-shadow:0 12px 26px -10px rgba(91,108,255,.8); }
  .btn.glow{ animation:pulse 1.6s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{ transform:scale(1); box-shadow:0 12px 26px -10px rgba(91,108,255,.8);}
    50%{ transform:scale(1.045); box-shadow:0 16px 34px -8px rgba(122,91,255,.95);} }
  @media (prefers-reduced-motion: reduce){ .btn.glow{ animation:none; } }

  .sheet{ width:100%; background:#fff; border-radius:20px; padding:8px; box-shadow:0 14px 30px -14px rgba(40,40,90,.4); }
  .sheet .row{ display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:12px 14px; font-size:14px; font-weight:600; color:#3b3f5c; border-radius:12px; }
  .sheet .row .ic{ font-size:18px; }
  .sheet .row.hot{ background:linear-gradient(135deg,rgba(91,108,255,.12),rgba(122,91,255,.12));
    color:var(--indigo); font-weight:800; outline:2px solid rgba(91,108,255,.5); }
  .sheet .div{ height:1px; background:#eef0f6; margin:2px 8px; }

  .qcard{ width:100%; background:#fff; border-radius:18px; padding:16px; box-shadow:0 14px 30px -16px rgba(40,40,90,.35); }
  .qcard .q{ font-size:15px; font-weight:800; color:#2a2e4d; margin-bottom:12px; }
  .chips{ display:flex; flex-wrap:wrap; gap:8px; justify-content:center; }
  .chip{ font-size:12.5px; font-weight:700; color:var(--chip-ink); background:var(--chip-bg);
    border:1.5px solid rgba(91,108,255,.28); padding:7px 12px; border-radius:99px; }
  .chip.sel{ background:linear-gradient(135deg,var(--indigo),var(--violet)); color:#fff; border-color:transparent; }

  .steps{ width:100%; display:flex; flex-direction:column; gap:8px; }
  .step{ display:flex; align-items:center; gap:11px; background:#fff; border-radius:14px;
    padding:11px 13px; box-shadow:0 8px 20px -14px rgba(40,40,90,.4); }
  .step .n{ width:24px; height:24px; border-radius:50%; background:#eef0ff; color:var(--indigo);
    font-weight:800; font-size:12px; display:flex; align-items:center; justify-content:center; flex:0 0 auto; }
  .step .t{ font-size:13.5px; font-weight:700; color:#33375a; text-align:left; line-height:1.2; }
  .step .t small{ display:block; font-weight:600; color:#8b90b0; font-size:11px; }
  .step.done .n{ background:var(--green); color:#fff; }
  .step.done .t{ color:#9aa0bd; }
  .step.cur{ outline:2px solid rgba(91,108,255,.55); }

  .nowcard{ width:100%; border-radius:20px; padding:20px 16px; color:#fff;
    background:linear-gradient(135deg,var(--indigo),var(--violet));
    box-shadow:0 16px 34px -16px rgba(91,108,255,.85); }
  .nowcard.rest{ background:linear-gradient(135deg,#2fa36b,#27b98a);
    box-shadow:0 16px 34px -16px rgba(39,185,138,.8); }
  .nowcard .nm{ font-size:16px; font-weight:900; }
  .nowcard .dt{ font-size:12.5px; opacity:.92; margin-top:3px; }
  .nowcard .clk{ font-size:40px; font-weight:900; margin-top:8px; letter-spacing:.02em;
    font-variant-numeric:tabular-nums; }
  .ticker{ margin-top:12px; display:inline-block; font-size:13.5px; font-weight:800;
    background:rgba(255,255,255,.2); padding:8px 13px; border-radius:99px; }

  .done-emoji{ font-size:64px; animation:pop .6s cubic-bezier(.2,1.4,.4,1); }
  @keyframes pop{ 0%{ transform:scale(0);} 100%{ transform:scale(1);} }
  @media (prefers-reduced-motion: reduce){ .done-emoji{ animation:none; } }

  .link{ font-size:14px; font-weight:800; color:var(--indigo); }
  .trust{ display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin-top:2px; }
  .trust span{ font-size:11px; font-weight:700; color:#5a6088; background:#eef0f8;
    padding:5px 10px; border-radius:99px; }

  /* ---- teleprompter (director notes) ---- */
  .prompter{ width:100%; max-width:392px; background:var(--stage);
    border:1px solid var(--stage-edge); border-radius:16px; padding:14px 16px;
    box-shadow:0 12px 30px -22px rgba(20,10,60,.5); }
  .prompter .lbl{ font-size:10.5px; font-weight:800; letter-spacing:.14em; text-transform:uppercase;
    color:var(--muted); display:flex; align-items:center; gap:6px; margin-bottom:5px; }
  .prompter .say{ font-size:15px; line-height:1.45; color:var(--ink); font-weight:500; }
  .prompter.hide{ display:none; }

  /* ---- controls ---- */
  .controls{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; justify-content:center; }
  .ctl{ font-family:inherit; font-size:13px; font-weight:700; color:var(--ink);
    background:var(--stage); border:1px solid var(--stage-edge); border-radius:12px;
    padding:10px 15px; cursor:pointer; display:flex; align-items:center; gap:7px; }
  .ctl:hover{ border-color:var(--indigo); }
  .ctl.primary{ background:linear-gradient(135deg,var(--indigo),var(--violet)); color:#fff; border-color:transparent; }
  .ctl:focus-visible{ outline:3px solid rgba(91,108,255,.5); outline-offset:2px; }
  .count{ font-size:12.5px; font-weight:700; color:var(--muted); font-variant-numeric:tabular-nums; min-width:44px; text-align:center; }
  .hint{ font-size:12px; color:var(--muted); text-align:center; max-width:380px; }

  /* tap zones for prev/next on the phone */
  .tapzone{ position:absolute; top:0; bottom:0; width:34%; z-index:5; cursor:pointer; background:transparent; border:0; }
  .tapzone.left{ left:0; } .tapzone.right{ right:0; }
</style>

<div class="wrap">
  <div class="kicker"><span>🎬</span> <b>MOWES</b> · Promo storyboard — from download to done</div>

  <div class="player">
    <div class="bars" id="bars"></div>
    <div class="phone">
      <div class="screen" id="screen">
        <button class="tapzone left" id="prevZone" aria-label="Previous step"></button>
        <button class="tapzone right" id="nextZone" aria-label="Next step"></button>
        <!-- slides injected here -->
      </div>
    </div>
  </div>

  <div class="prompter" id="prompter">
    <div class="lbl">🎙 Say this <span id="stepName" style="color:var(--indigo);letter-spacing:0;text-transform:none"></span></div>
    <div class="say" id="sayText"></div>
  </div>

  <div class="controls">
    <button class="ctl primary" id="play">⏸ Pause</button>
    <button class="ctl" id="prev">‹ Back</button>
    <span class="count" id="count">1 / 10</span>
    <button class="ctl" id="next">Next ›</button>
    <button class="ctl" id="notes">🎙 Notes: On</button>
    <button class="ctl" id="replay">↺ Replay</button>
  </div>
  <div class="hint">Plays on its own like a video — tap the left/right side of the phone to step through. Hide the notes and screen-record the phone to make your clip.</div>
</div>

<script>
(function(){
  var SLIDE_MS = 4200;

  var slides = [
    { eyebrow:"Meet MOWES",
      cap:{ big:"Your whole workout, start to finish", pill:"Free right now · No sign-up" },
      say:"Let me show you my free workout app — from the second you get it, to finishing your whole workout.",
      scene:'<div class="logo-wrap"><div class="barbell">🏋️</div><div class="logo"><span class="fist">💪</span>MOWES</div><div class="tag">My Own Weekly Exercise Sheet</div></div><div class="badge">🔒 Private · Works offline</div>' },

    { eyebrow:"Step 1 · Install",
      cap:{ big:"Add it like a real app", pill:"Add to Home Screen" },
      say:"First, add it to your phone like a real app — tap Share, then 'Add to Home Screen.' Done. It even works with no internet.",
      scene:'<div class="sheet"><div class="row"><span>Copy Link</span><span class="ic">🔗</span></div><div class="div"></div><div class="row hot"><span>Add to Home Screen</span><span class="ic">➕</span></div><div class="div"></div><div class="row"><span>Add Bookmark</span><span class="ic">📑</span></div></div>' },

    { eyebrow:"Step 2 · Open",
      cap:{ big:"No email, / No account, / Right now FREE!", pill:"Just tap to open" },
      say:"Open it up — no account, no email, nothing to sign up for.",
      scene:'<div class="logo-wrap"><div class="barbell">🏋️</div><div class="logo"><span class="fist">💪</span>MOWES</div><div class="tag">My Own Weekly Exercise Sheet</div></div><div class="btn glow">Go into the Gym →</div>' },

    { eyebrow:"Step 3 · Guided start",
      cap:{ big:"Answer a couple quick questions", pill:"Pick your exercises" },
      say:"It asks a couple quick questions and you pick a few exercises — that's it.",
      scene:'<div class="qcard"><div class="q">What do you want to work on?</div><div class="chips"><span class="chip sel">💪 Strength</span><span class="chip">🏃 Cardio</span><span class="chip sel">🧘 Core</span><span class="chip">🚶 Walking</span></div></div>' },

    { eyebrow:"Step 4 · Ready to go",
      cap:{ big:"Your whole day, already filled in", pill:"Warm-up · Work · Cool-down" },
      say:"And boom — your whole day is ready. Warm-up, your exercises, cool-down — already filled in.",
      scene:'<div class="steps"><div class="step"><div class="n">1</div><div class="t">🤸 Warm-up<small>Get moving</small></div></div><div class="step"><div class="n">2</div><div class="t">💪 Push-ups<small>3 sets · 12 reps</small></div></div><div class="step"><div class="n">3</div><div class="t">🦵 Squats<small>3 sets · 12 reps</small></div></div><div class="step"><div class="n">4</div><div class="t">🧘 Cool-down<small>Stretch it out</small></div></div></div>' },

    { eyebrow:"Step 5 · The magic",
      cap:{ big:"Tap Start / it walks you through", pill:"Today · Friday" },
      say:"Now the magic: tap Start, and it walks you through the whole thing.",
      scene:'<div class="tag" style="font-size:15px;font-weight:800;color:#2a2e4d">Today · Friday</div><div class="btn glow" style="font-size:19px;padding:16px 40px">▶ Start</div>' },

    { eyebrow:"Step 6 · It ticks for you",
      cap:{ big:"Each step counts down for you", pill:"Hands-free timing" },
      say:"Each step counts down for you — no fiddling with a stopwatch.",
      scene:'<div class="nowcard"><div class="nm">💪 Push-ups · Set 1</div><div class="dt">12 reps · go!</div><div class="clk" id="liveclk">0:38</div></div>' },

    { eyebrow:"Step 7 · The ticker",
      cap:{ big:"It tells you what's coming next", pill:"Never lose your place" },
      say:"And while you rest, it tells you what's coming next — so you never lose your place.",
      scene:'<div class="nowcard rest"><div class="nm">Rest</div><div class="clk">0:15</div><div class="ticker" id="tickline">Up next → 🦵 Squats · Set 1</div></div>' },

    { eyebrow:"Step 8 · All the way",
      cap:{ big:"Step by step to your last one", pill:"You just follow along" },
      say:"Step by step, all the way to your last exercise of the day.",
      scene:'<div class="steps"><div class="step done"><div class="n">✓</div><div class="t">🤸 Warm-up<small>Done</small></div></div><div class="step done"><div class="n">✓</div><div class="t">💪 Push-ups<small>Done</small></div></div><div class="step done"><div class="n">✓</div><div class="t">🦵 Squats<small>Done</small></div></div><div class="step cur"><div class="n">4</div><div class="t">🧘 Cool-down<small>Last one!</small></div></div></div>' },

    { eyebrow:"Step 9 · Done",
      cap:{ big:"That's your whole workout", pill:"🎉 Workout complete" },
      say:"And… done. That's your whole workout — guided, from start to finish.",
      scene:'<div class="done-emoji">🎉</div><div style="font-size:22px;font-weight:900;color:#2a2e4d">Done!</div><div class="tag">Great work today. 💪</div>' },

    { eyebrow:"Try it free",
      cap:{ big:"Yours, private, free right now", pill:"" },
      cta:"https://getermes.github.io/mowes", ctaLabel:"MOWES 🔗",
      say:"It's free, it's private, and your data stays on your phone. Link's in the description — give it a try, and hit Subscribe. No sign-up, your data stays on your phone. Free.",
      scene:'<div class="link">getermes.github.io/mowes</div>' }
  ];

  var screen = document.getElementById('screen');
  var barsWrap = document.getElementById('bars');
  var sayText = document.getElementById('sayText');
  var stepName = document.getElementById('stepName');
  var countEl = document.getElementById('count');
  var playBtn = document.getElementById('play');
  var notesBtn = document.getElementById('notes');
  var prompter = document.getElementById('prompter');

  // Wrap each caption word in its own span so it can reveal one-by-one.
  function wordsHTML(str){
    var n = 0;
    return str.split(' ').map(function(w){
      if(w === '/') return '<br>';            // '/' forces a line break between words
      var span = '<span class="w" style="transition-delay:' + (0.55 + n * 0.12).toFixed(2) + 's">' + w + '</span>';
      n++;
      return span;
    }).join(' ');
  }

  // build slides + bars
  var fills = [];
  slides.forEach(function(s, i){
    var el = document.createElement('div');
    el.className = 'slide';
    el.innerHTML = '<div class="eyebrow">' + s.eyebrow + '</div>' + s.scene +
      '<div class="cap"><div class="pill">' + s.cap.pill + '</div><div class="big">' + wordsHTML(s.cap.big) + '</div>' +
      (s.cta ? '<a class="cta-btn" href="' + s.cta + '" target="_blank" rel="noopener">' + (s.ctaLabel || 'Open') + '</a>' : '') +
      '</div>';
    screen.appendChild(el);
    s.el = el;

    var bar = document.createElement('div'); bar.className = 'bar';
    var fill = document.createElement('i'); bar.appendChild(fill); barsWrap.appendChild(bar);
    fills.push(fill);
  });

  var idx = 0, playing = true, startAt = Date.now(), raf = null;

  function reduceMotion(){ return window.matchMedia('(prefers-reduced-motion: reduce)').matches; }

  function show(i){
    idx = (i + slides.length) % slides.length;
    slides.forEach(function(s, k){ s.el.classList.toggle('on', k === idx); });
    fills.forEach(function(f, k){ f.style.width = k < idx ? '100%' : '0%'; });
    sayText.textContent = slides[idx].say;
    stepName.textContent = '— ' + slides[idx].eyebrow;
    countEl.textContent = (idx + 1) + ' / ' + slides.length;
    startAt = Date.now();
    animateClock();
  }

  function tick(){
    if(!playing){ return; }
    var elapsed = Date.now() - startAt;
    var p = Math.min(1, elapsed / SLIDE_MS);
    fills[idx].style.width = (p * 100) + '%';
    if(p >= 1){
      if(idx < slides.length - 1){ show(idx + 1); }
      else { playing = false; }   // freeze on the final slide so the "open app" button can be tapped
    }
    raf = requestAnimationFrame(tick);
  }

  function setPlaying(on){
    playing = on;
    playBtn.textContent = on ? '⏸ Pause' : '▶ Play';
    playBtn.classList.toggle('primary', !on);
    if(on){ startAt = Date.now() - (parseFloat(fills[idx].style.width)||0)/100*SLIDE_MS; cancelAnimationFrame(raf); raf = requestAnimationFrame(tick); }
    else { cancelAnimationFrame(raf); }
  }

  // little live countdown flourish on the timer slides
  var clockTimer = null;
  function animateClock(){
    if(clockTimer){ clearInterval(clockTimer); clockTimer = null; }
    if(reduceMotion()) return;
    var live = slides[idx].el.querySelector('#liveclk');
    if(!live) return;
    var t = 38;
    clockTimer = setInterval(function(){
      t = t <= 34 ? 38 : t - 1;
      var m = Math.floor(t/60), s = t%60;
      live.textContent = m + ':' + (s<10?'0':'') + s;
    }, 1000);
  }

  document.getElementById('next').onclick = function(){ show(idx + 1); };
  document.getElementById('prev').onclick = function(){ show(idx - 1); };
  document.getElementById('nextZone').onclick = function(){ show(idx + 1); };
  document.getElementById('prevZone').onclick = function(){ show(idx - 1); };
  document.getElementById('replay').onclick = function(){ show(0); setPlaying(true); };
  playBtn.onclick = function(){ setPlaying(!playing); };
  notesBtn.onclick = function(){
    var hidden = prompter.classList.toggle('hide');
    notesBtn.textContent = hidden ? '🎙 Notes: Off' : '🎙 Notes: On';
  };
  document.addEventListener('keydown', function(e){
    if(e.key === 'ArrowRight'){ show(idx + 1); }
    else if(e.key === 'ArrowLeft'){ show(idx - 1); }
    else if(e.key === ' '){ e.preventDefault(); setPlaying(!playing); }
  });

  show(0);
  raf = requestAnimationFrame(tick);
})();
</script>
</body>
</html>
