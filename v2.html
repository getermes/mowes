<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MOWES — My Own Weekly Exercise Sheet</title>
<meta name="theme-color" content="#d3ddfb">
<style>
/* ==========================================================================
   MOWES v2 — Phase 1: the Cover, Today's MOWES, and Build MOWES. That's all.
   Phase 2 = the initial set-up. Phase 3 = the run.

   A ROUTINE IS ONE MOVE. "Arms, 15 reps, 4 sets" is a routine. "Run, 20
   minutes" is another. You make a pile of them quickly, then hand out the days
   of the week yourself — that's what builds your own schedule.
   ========================================================================== */

  :root{
    --ink:      #2b3050;
    --ink-soft: #6a7088;
    --line:     #e2e6f7;
    --card:     #ffffff;
    --bg:       #f2f4fd;
    --violet:   #5b6cff;
    --violet-2: #7a5bff;
    --gold:     #F0A32E;
    --gold-ink: #B5760F;
    --good:     #1f9d64;
    --bar-h:    68px;
  }
  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body{ margin:0; padding:0; }
  body{
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--ink);
    font-size: 16px; line-height: 1.5;
    padding-bottom: calc(var(--bar-h) + env(safe-area-inset-bottom));
  }
  button{ font: inherit; color: inherit; cursor: pointer; }

  /* ---------- shared bits ---------- */
  .wrap{ max-width: 420px; margin: 0 auto; padding: 18px 16px 8px; }
  .card{
    background: var(--card); border: 1px solid var(--line);
    border-radius: 18px; padding: 16px; margin-bottom: 14px;
    box-shadow: 0 2px 10px rgba(91,108,255,.05);
  }
  .h1{ font-size: 24px; font-weight: 800; margin: 0 0 2px; letter-spacing: -.3px; }
  .sub{ color: var(--ink-soft); font-size: 14px; margin: 0 0 16px; }
  .big-btn{
    display:block; width:100%; border:0; border-radius:16px;
    padding:17px 18px; font-size:18px; font-weight:800; color:#fff;
    background: linear-gradient(135deg, var(--violet), var(--violet-2));
    box-shadow: 0 6px 16px rgba(91,108,255,.30); margin-bottom:10px;
  }
  .big-btn.grey{ background:#eef0fa; color: var(--ink); box-shadow:none; }
  .row-btn{
    display:flex; align-items:center; gap:12px; width:100%; text-align:left;
    background: var(--card); border:1px solid var(--line); border-radius:16px;
    padding:14px 16px; margin-bottom:9px;
  }
  .row-btn .rb-emoji{ font-size:24px; line-height:1; flex:0 0 auto; }
  .row-btn .rb-name{ font-weight:700; }
  .row-btn .rb-meta{ color: var(--ink-soft); font-size:13px; }
  .row-btn .rb-days{ color: var(--violet); font-size:13px; font-weight:700; }
  .row-btn .rb-nodays{ color: var(--gold-ink); font-size:13px; font-weight:700; }
  .empty{ text-align:center; color: var(--ink-soft); padding: 26px 10px; }
  .empty .em-emoji{ font-size:44px; display:block; margin-bottom:8px; }
  .field{ display:block; margin-bottom:16px; }
  .field .lab{ display:block; font-size:13px; font-weight:700; color: var(--ink-soft); margin-bottom:7px; }
  .field .lab .opt{ font-weight:600; color:#98a0bb; }
  .field input{
    width:100%; font:inherit; padding:13px 14px; border-radius:13px;
    border:1px solid var(--line); background:#fbfcff; color:var(--ink);
  }
  .field input:focus{ outline:2px solid var(--violet); border-color:transparent; }
  .flash{
    background:#eafaf1; border:1px solid #bfe8d2; color:#1b6b45;
    border-radius:14px; padding:12px 14px; margin-bottom:12px; font-size:14.5px;
  }

  /* ---------- the Cover ---------- */
  .cover{
    position: fixed; inset: 0; z-index: 900;
    display: none; justify-content: center; align-items: stretch;
    padding: 34px 18px 40px; overflow-y: auto;
    background: linear-gradient(180deg,#d3ddfb 0%,#dadcf6 55%,#d6def9 100%);
  }
  .cover.show{ display:flex; }
  .cover.as-page{ z-index: 500; padding-bottom: calc(var(--bar-h) + 24px); }
  .cover-box{ max-width:360px; width:100%; text-align:center; display:flex; flex-direction:column; position:relative; }
  .c-mark{
    font-size:18px; font-weight:800; letter-spacing:1.5px;
    background: linear-gradient(135deg,var(--violet),var(--violet-2));
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
  }
  .c-tag{ margin-top:5px; color:var(--gold-ink); font-size:13px; font-weight:700; }
  .c-dumbbell{ display:block; width:104px; height:auto; margin:auto auto 0; transform:translateY(-12px); }
  .c-emoji{ font-size:46px; margin:-42px 0 0; position:relative; z-index:5; }
  .c-title{ font-weight:800; position:relative; z-index:5; }
  .c-name{
    display:inline-block; font-size:clamp(40px,15.5vw,72px); font-weight:800; letter-spacing:1px;
    transform:scaleY(2.5); transform-origin:center;
    background:linear-gradient(135deg,var(--violet),var(--violet-2));
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
  }
  .c-sub{ font-size:13px; color:var(--violet); margin-top:-50px; position:relative; z-index:5; }
  .c-barbell{ display:block; position:relative; left:50%; transform:translateX(-50%); width:98vw; max-width:460px; height:auto; margin:-20px 0 0; z-index:5; }
  .c-btn{
    margin-top:auto; border:0; border-radius:16px; padding:17px 18px;
    font-size:18px; font-weight:800; color:#fff;
    background:linear-gradient(135deg,var(--violet),var(--violet-2));
    box-shadow:0 8px 20px rgba(91,108,255,.32);
  }
  .c-note{ font-size:12px; color:var(--ink-soft); margin:14px 0 0; }
  .c-note .wn-name{ font-weight:700; color:var(--gold-ink); }
  .sky{ position:absolute; top:13%; left:0; right:0; height:44%; overflow:hidden; pointer-events:none; z-index:1; }
  .sky span{ position:absolute; left:0; will-change:transform; }
  .sky svg{ display:block; opacity:.75; }
  .sky span:nth-child(1){ top:6%;  width:74px;  animation: drift 34s linear infinite; }
  .sky span:nth-child(2){ top:38%; width:104px; animation: drift 46s linear infinite -12s; }
  .sky span:nth-child(3){ top:64%; width:60px;  animation: drift 39s linear infinite -25s; }
  @keyframes drift{ from{ transform: translateX(-130px); } to{ transform: translateX(105vw); } }

  /* ---------- bottom page bar ---------- */
  .bar{
    position: fixed; left:0; right:0; bottom:0; z-index: 800;
    height: calc(var(--bar-h) + env(safe-area-inset-bottom));
    padding-bottom: env(safe-area-inset-bottom);
    display:flex; background: rgba(255,255,255,.96);
    border-top:1px solid var(--line); backdrop-filter: blur(8px);
  }
  .bar button{
    flex:1; border:0; background:none; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:2px;
    font-size:11px; font-weight:700; color:var(--ink-soft); padding:0;
  }
  .bar button .b-emoji{ font-size:22px; line-height:1; }
  .bar button.on{ color: var(--violet); }

  /* ---------- Today's MOWES ---------- */
  .today-date{ color:var(--ink-soft); font-size:13px; font-weight:700; margin-bottom:14px; }
  .move{
    display:flex; align-items:center; gap:13px;
    padding:14px 4px; border-bottom:1px solid var(--line);
  }
  .move:last-child{ border-bottom:0; }
  .move .m-tick{
    flex:0 0 30px; height:30px; border-radius:50%;
    border:2px solid var(--line); background:#fff;
    display:flex; align-items:center; justify-content:center; font-size:16px; color:#fff;
  }
  .move.done .m-tick{ background:var(--good); border-color:var(--good); }
  .move.done .m-name{ text-decoration: line-through; color: var(--ink-soft); }
  .move .m-name{ font-weight:700; }
  .move .m-meta{ color:var(--ink-soft); font-size:13px; }
  .move.now{ background:#f6f4ff; border-radius:12px; padding-left:10px; padding-right:10px; }
  .progress{ height:8px; border-radius:99px; background:#eceffb; overflow:hidden; margin:4px 0 10px; }
  .progress i{ display:block; height:100%; background:linear-gradient(90deg,var(--violet),var(--violet-2)); transition:width .3s ease; }
  .done-note{ text-align:center; padding:12px 0 4px; }
  .done-note .dn-emoji{ font-size:48px; display:block; }
  .done-note .dn-msg{ font-weight:800; font-size:19px; margin-top:4px; }

  /* ---------- Build MOWES ---------- */
  .days{ display:flex; gap:5px; }
  .days button{
    flex:1; border:1px solid var(--line); background:#fbfcff; color:var(--ink-soft);
    border-radius:11px; padding:12px 0; font-size:13px; font-weight:800;
  }
  .days button.on{ background:var(--violet); border-color:var(--violet); color:#fff; }
  /* Reps or minutes — one choice, two big targets. */
  .seg{ display:flex; gap:8px; }
  .seg button{
    flex:1; border:1px solid var(--line); background:#fbfcff; color:var(--ink-soft);
    border-radius:13px; padding:13px 0; font-size:15px; font-weight:800;
  }
  .seg button.on{ background:var(--violet); border-color:var(--violet); color:#fff; }
  .nums{ display:flex; gap:10px; }
  .nums label{ flex:1; }
  .nums .n-lab{ display:block; font-size:12.5px; font-weight:700; color:var(--ink-soft); margin-bottom:6px; }
  .nums input{
    width:100%; font:inherit; font-size:19px; font-weight:700; text-align:center;
    padding:12px 6px; border-radius:13px; border:1px solid var(--line);
    background:#fbfcff; color:var(--ink);
  }
  .link-btn{ border:0; background:none; color:var(--violet); font-weight:700; padding:9px 0; display:block; margin:0 auto; }
  .danger{ color:#c0392b; }
  /* The week you built for yourself. */
  .week{ margin-top:6px; }
  .week-row{ display:flex; gap:12px; padding:10px 2px; border-bottom:1px solid var(--line); font-size:14px; }
  .week-row:last-child{ border-bottom:0; }
  .week-row .wk-day{ flex:0 0 42px; font-weight:800; color:var(--ink-soft); }
  .week-row.today .wk-day{ color:var(--violet); }
  .week-row.today{ background:#f6f4ff; border-radius:10px; padding-left:8px; padding-right:8px; }
  .week-row .wk-list{ flex:1; }
  .week-row .wk-none{ color:#aab1c8; }

  /* ---------- support set (on every page) ---------- */
  .support{ display:flex; gap:10px; justify-content:center; margin:18px 0 6px; }
  .support button, .support a{
    display:flex; align-items:center; gap:7px; text-decoration:none;
    border:1px solid var(--line); background:#fff; color:var(--ink-soft);
    border-radius:999px; padding:9px 15px; font-size:14px; font-weight:700;
  }
  .support button.liked{ color:#c0392b; border-color:#f3d3d3; background:#fff6f6; }
  .trust{ text-align:center; color:var(--ink-soft); font-size:12.5px; line-height:1.6; padding:4px 6px 10px; }
  .trust b{ color: var(--ink); }
</style>
</head>
<body>

<div class="cover" id="cover">
  <div class="sky" aria-hidden="true">
    <span><svg viewBox="0 0 100 56" xmlns="http://www.w3.org/2000/svg"><g fill="#fff"><rect x="14" y="28" width="70" height="20" rx="10"/><circle cx="40" cy="23" r="20"/><circle cx="65" cy="30" r="14"/><circle cx="24" cy="32" r="12"/></g></svg></span>
    <span><svg viewBox="0 0 100 56" xmlns="http://www.w3.org/2000/svg"><g fill="#fff"><rect x="8" y="31" width="84" height="14" rx="7"/><circle cx="30" cy="31" r="12"/><circle cx="52" cy="27" r="15"/><circle cx="72" cy="32" r="10"/></g></svg></span>

<!-- ===================== 1st PAGE — TODAY'S MOWES ===================== -->
<div class="wrap page" id="pageToday" hidden>
  <h1 class="h1">Today's MOWES</h1>
  <div class="today-date" id="todayDate"></div>
  <div id="todayBody"></div>

</div>

<div class="wrap page" id="pageBuild" hidden>
  <h1 class="h1">Build MOWES</h1>
  <p class="sub" id="buildSub">One move at a time. Days are up to you — pick them now or later.</p>
  <div id="buildBody"></div>

<!-- ===================== BOTTOM PAGE BAR ===================== -->
<nav class="bar" id="bar">
  <button onclick="tap('cover')" id="tabCover"><span class="b-emoji">📖</span>Cover</button>
  <button onclick="tap('today')" id="tabToday"><span class="b-emoji">▶️</span>Today's</button>
  <button onclick="tap('build')" id="tabBuild"><span class="b-emoji">🛠️</span>Build</button>

<script>
/* ==========================================================================
   Everything lives on this phone. No account, no server, nothing sent out.

   A routine is ONE move:
     { id, name, kind:"reps"|"time", reps, sets, minutes, days:[0..6] }
   `days` may be empty — that's allowed. It just means "made, not scheduled yet".
   ========================================================================== */

var KEY = "mowes2_v1";
var DAY_NAMES = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
// Two letters, not one — "S M T W T F S" gives two T's and two S's, and there
// is no way to tell Tuesday from Thursday.
var DAY_SHORT = ["Su","Mo","Tu","We","Th","Fr","Sa"];

/* ---------- saved data ---------- */
function blank(){ return { routines: [], done: {} }; }
var data = blank();

function load(){
  try {
    var raw = localStorage.getItem(KEY);
    data = raw ? JSON.parse(raw) : blank();
  } catch(e){ data = blank(); }
  if (!data || typeof data !== "object") data = blank();
  if (!Array.isArray(data.routines)) data.routines = [];
  if (!data.done || typeof data.done !== "object") data.done = {};
  upgradeOldShape();
}
// An earlier build stored a routine as a folder of steps. Each of those steps is
// really a routine of its own now, so split them out instead of losing them.
function upgradeOldShape(){
  var out = [], changed = false;
  for (var i = 0; i < data.routines.length; i++){
    var r = data.routines[i];
    if (r && Array.isArray(r.steps)){
      changed = true;
      for (var s = 0; s < r.steps.length; s++){
        var st = r.steps[s];
        out.push({
          id: newId(), name: st.name,
          kind: st.kind === "time" ? "time" : "reps",
          reps: st.kind === "time" ? 10 : (st.amount || 10),
          sets: st.sets || 1,
          minutes: st.kind === "time" ? (st.amount || 10) : 10,
          days: (r.days || []).slice()
        });
      }
    } else if (r){ out.push(r); }
  }
  if (changed){ data.routines = out; data.done = {}; save(); }
}
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(data)); }
  catch(e){ /* a full or blocked storage shouldn't break the workout */ }
}
function newId(){ return "r" + Date.now().toString(36) + Math.floor(Math.random()*1e6).toString(36); }
function todayKey(d){ d = d || new Date(); return d.getFullYear() + "-" + (d.getMonth()+1) + "-" + d.getDate(); }

/* How a move reads out loud: "4 sets × 15 reps" or "20 minutes". */
function moveMeta(r){
  if (r.kind === "time") return r.minutes + (r.minutes == 1 ? " minute" : " minutes");
  var reps = r.reps + (r.reps == 1 ? " rep" : " reps");
  return (r.sets > 1) ? (r.sets + " sets × " + reps) : reps;
}
function daysText(r){
  var d = (r.days || []).slice().sort(function(a,b){ return a-b; });
  if (!d.length) return "";
  if (d.length === 7) return "Every day";
  return d.map(function(x){ return DAY_NAMES[x].slice(0,3); }).join(", ");
}

/* ---------- page switching ---------- */
var current = "cover";

function go(where){
  current = where;
  var cover = document.getElementById("cover");
  cover.classList.toggle("show", where === "cover");
  cover.classList.toggle("as-page", where === "cover");
  document.getElementById("pageToday").hidden = (where !== "today");
  document.getElementById("pageBuild").hidden = (where !== "build");
  document.getElementById("tabCover").classList.toggle("on", where === "cover");
  document.getElementById("tabToday").classList.toggle("on", where === "today");
  document.getElementById("tabBuild").classList.toggle("on", where === "build");
  if (where === "today") drawToday();
  if (where === "build") drawBuild();
  window.scrollTo(0, 0);
}
// The bottom bar always drops whatever you were editing, so "Build" takes you to
// your list instead of trapping you in the editor.
function tap(where){ editing = null; flash = ""; go(where); }
function openApp(){ document.getElementById("cover").classList.remove("show"); go("today"); }

/* ---------- 1st page: Today's MOWES ---------- */
function routinesForToday(){
  var wd = new Date().getDay();
  return data.routines.filter(function(r){ return (r.days || []).indexOf(wd) !== -1; });
}
// The next day this move comes around, so a save never looks like it vanished.
function nextDayText(r){
  var days = (r.days || []);
  if (!days.length) return "";
  var wd = new Date().getDay();
  for (var i = 0; i < 7; i++){
    var d = (wd + i) % 7;
    if (days.indexOf(d) !== -1) return (i === 0) ? "today" : (i === 1 ? "tomorrow" : DAY_NAMES[d]);
  }
  return "";
}
function doneList(){
  var k = todayKey();
  if (!Array.isArray(data.done[k])) data.done[k] = [];
  return data.done[k];
}
function isDone(id){ return doneList().indexOf(id) !== -1; }
function toggleDone(id){
  var list = doneList(), at = list.indexOf(id);
  if (at === -1) list.push(id); else list.splice(at, 1);
  save(); drawToday();
}

function drawToday(){
  var now = new Date();
  document.getElementById("todayDate").textContent = DAY_NAMES[now.getDay()];
  var box = document.getElementById("todayBody");
  var todays = routinesForToday();

  if (!data.routines.length){
    box.innerHTML =
      '<div class="card"><div class="empty">' +
        '<span class="em-emoji">👋</span>' +
        '<b>Nothing here yet</b><br>Build a few moves, give them days, and they show up here.' +
      '</div><button class="big-btn" onclick="tap(\'build\')">Build my first move</button></div>';
    return;
  }
  if (!todays.length){
    var soonest = "", unscheduled = 0;
    for (var n = 0; n < data.routines.length; n++){
      if (!(data.routines[n].days || []).length) unscheduled++;
      else if (!soonest) soonest = nextDayText(data.routines[n]);
    }
    box.innerHTML =
      '<div class="card"><div class="empty">' +
        '<span class="em-emoji">😌</span>' +
        '<b>Rest day</b><br>Nothing set for ' + DAY_NAMES[now.getDay()] + '. Rest counts too.' +
        (soonest ? '<br><br>Your next one is <b>' + esc(soonest) + '</b>.' : '') +
        (unscheduled ? '<br><br>You have <b>' + unscheduled + '</b> move' + (unscheduled === 1 ? '' : 's') +
                       ' with no days yet.' : '') +
      '</div><button class="big-btn grey" onclick="tap(\'build\')">Pick my days</button></div>';
    return;
  }

  var doneCount = 0;
  for (var i = 0; i < todays.length; i++) if (isDone(todays[i].id)) doneCount++;
  var allDone = doneCount === todays.length;
  var nextAt = -1;
  for (var j = 0; j < todays.length; j++){ if (!isDone(todays[j].id)){ nextAt = j; break; } }

  var html = '<div class="card">';
  html += '<div class="rb-meta">' + doneCount + ' of ' + todays.length + ' done</div>';
  html += '<div class="progress"><i style="width:' + Math.round(doneCount/todays.length*100) + '%"></i></div>';
  for (var k = 0; k < todays.length; k++){
    var r = todays[k], d = isDone(r.id);
    html += '<div class="move' + (d ? ' done' : '') + (k === nextAt ? ' now' : '') + '" onclick="toggleDone(\'' + r.id + '\')">' +
              '<div class="m-tick">' + (d ? '✓' : '') + '</div>' +
              '<div><div class="m-name">' + esc(r.name) + '</div>' +
              '<div class="m-meta">' + esc(moveMeta(r)) + '</div></div>' +
            '</div>';
  }
  if (allDone){
    html += '<div class="done-note"><span class="dn-emoji">🎉</span>' +
            '<div class="dn-msg">You did it.</div>' +
            '<div class="rb-meta">That\'s ' + DAY_NAMES[now.getDay()] + ' handled.</div></div>';
  }
  html += '</div>';
  box.innerHTML = html;
}

/* ---------- 2nd page: Build MOWES ---------- */
var editing = null;   // the move being made or changed, null when showing the list
var flash = "";       // a one-time "saved" line above the list

function drawBuild(){
  var box = document.getElementById("buildBody");
  var sub = document.getElementById("buildSub");
  if (editing){
    sub.textContent = editing.isNew ? "Name it, say how much, and save. Days are optional."
                                    : "Change anything here, including the days.";
    box.innerHTML = editorHtml(editing);
    return;
  }
  sub.textContent = "One move at a time. Days are up to you — pick them now or later.";

  var html = "";
  if (flash){ html += '<div class="flash">' + flash + '</div>'; flash = ""; }

  if (!data.routines.length){
    html += '<div class="card"><div class="empty">' +
              '<span class="em-emoji">🛠️</span>' +
              '<b>No moves yet</b><br>A move is one thing you do — "Arms, 15 reps, 4 sets" or "Run, 20 minutes".' +
            '</div></div>';
  } else {
    for (var i = 0; i < data.routines.length; i++){
      var r = data.routines[i], days = daysText(r);
      html += '<button class="row-btn" onclick="editRoutine(\'' + r.id + '\')">' +
                '<span class="rb-emoji">' + (r.kind === "time" ? "⏱️" : "🔁") + '</span>' +
                '<span><span class="rb-name">' + esc(r.name) + '</span><br>' +
                '<span class="rb-meta">' + esc(moveMeta(r)) + '</span><br>' +
                (days ? '<span class="rb-days">' + esc(days) + '</span>'
                      : '<span class="rb-nodays">No days yet — tap to pick</span>') +
              '</span></button>';
    }
  }
  html += '<button class="big-btn" onclick="newRoutine()">+ New move</button>';
  if (data.routines.length) html += weekHtml();
  box.innerHTML = html;
}

// Your week, exactly as you set it up.
function weekHtml(){
  var wd = new Date().getDay();
  var html = '<div class="card"><div class="lab" style="font-size:13px;font-weight:700;color:var(--ink-soft);margin-bottom:4px">YOUR WEEK</div><div class="week">';
  for (var d = 0; d < 7; d++){
    var onDay = data.routines.filter(function(r){ return (r.days || []).indexOf(d) !== -1; });
    html += '<div class="week-row' + (d === wd ? ' today' : '') + '">' +
              '<div class="wk-day">' + DAY_SHORT[d] + '</div>' +
              '<div class="wk-list">' +
                (onDay.length ? onDay.map(function(r){ return esc(r.name); }).join(", ")
                              : '<span class="wk-none">rest</span>') +
              '</div></div>';
  }
  return html + '</div></div>';
}

function newRoutine(){
  editing = { id: newId(), name: "", kind: "reps", reps: 15, sets: 4, minutes: 20, days: [], isNew: true };
  go("build");
}
function editRoutine(id){
  var r = data.routines.filter(function(x){ return x.id === id; })[0];
  if (!r) return;
  editing = JSON.parse(JSON.stringify(r));   // a copy, so backing out changes nothing
  editing.isNew = false;
  go("build");
}

function editorHtml(r){
  var html = '<div class="card">';
  html += '<label class="field"><span class="lab">Name it</span>' +
          '<input id="edName" value="' + esc(r.name) + '" placeholder="Arms" maxlength="40" autocomplete="off"></label>';

  html += '<div class="field"><span class="lab">How do you count it?</span><div class="seg">' +
            '<button type="button" class="' + (r.kind === "reps" ? "on" : "") + '" onclick="setKind(\'reps\')">🔁 Reps</button>' +
            '<button type="button" class="' + (r.kind === "time" ? "on" : "") + '" onclick="setKind(\'time\')">⏱️ Minutes</button>' +
          '</div></div>';

  if (r.kind === "reps"){
    html += '<div class="field"><div class="nums">' +
              '<label><span class="n-lab">Reps</span><input id="edReps" type="number" inputmode="numeric" min="1" max="999" value="' + r.reps + '"></label>' +
              '<label><span class="n-lab">Sets</span><input id="edSets" type="number" inputmode="numeric" min="1" max="99" value="' + r.sets + '"></label>' +
            '</div></div>';
  } else {
    html += '<div class="field"><div class="nums">' +
              '<label><span class="n-lab">Minutes</span><input id="edMins" type="number" inputmode="numeric" min="1" max="999" value="' + r.minutes + '"></label>' +
            '</div></div>';
  }

  html += '<div class="field"><span class="lab">Which days? <span class="opt">— optional, you can set these later</span></span><div class="days">';
  for (var d = 0; d < 7; d++){
    html += '<button type="button" class="' + ((r.days||[]).indexOf(d) !== -1 ? 'on' : '') + '" onclick="toggleDay(' + d + ')">' + DAY_SHORT[d] + '</button>';
  }
  html += '</div></div>';

  if (r.isNew){
    // Making a pile of moves in one sitting is the normal thing to do, so the
    // button that keeps you going is the big one.
    html += '<button class="big-btn" onclick="saveRoutine(true)">Save &amp; add another</button>';
    html += '<button class="big-btn grey" onclick="saveRoutine(false)">Save &amp; done</button>';
  } else {
    html += '<button class="big-btn" onclick="saveRoutine(false)">Save</button>';
  }
  html += '<button class="link-btn" onclick="cancelEdit()">Back without saving</button>';
  if (!r.isNew) html += '<button class="link-btn danger" onclick="deleteRoutine()">Delete this move</button>';
  html += '</div>';
  return html;
}

/* Pull whatever is typed on screen into memory before any redraw. */
function grabFields(){
  if (!editing) return;
  var n = document.getElementById("edName");   if (n) editing.name = n.value;
  var rp = document.getElementById("edReps");  if (rp) editing.reps = clampNum(rp.value, 1, 999, editing.reps);
  var st = document.getElementById("edSets");  if (st) editing.sets = clampNum(st.value, 1, 99, editing.sets);
  var mn = document.getElementById("edMins");  if (mn) editing.minutes = clampNum(mn.value, 1, 999, editing.minutes);
}
function clampNum(v, lo, hi, fallback){
  var n = parseInt(v, 10);
  if (isNaN(n)) return fallback;
  return Math.min(hi, Math.max(lo, n));
}
function setKind(kind){ grabFields(); editing.kind = kind; drawBuild(); }
function toggleDay(d){
  grabFields();
  var at = editing.days.indexOf(d);
  if (at === -1) editing.days.push(d); else editing.days.splice(at, 1);
  drawBuild();
}
function cancelEdit(){ editing = null; drawBuild(); }

function saveRoutine(addAnother){
  grabFields();
  var name = (editing.name || "").trim();
  if (!name){ alert("Give this move a name first — like Arms, Run, or Walk."); return; }
  var saved = {
    id: editing.id, name: name, kind: editing.kind,
    reps: editing.reps, sets: editing.sets, minutes: editing.minutes,
    days: editing.days.slice()
  };
  var at = -1;
  for (var i = 0; i < data.routines.length; i++) if (data.routines[i].id === saved.id) at = i;
  if (at === -1) data.routines.push(saved); else data.routines[at] = saved;
  save();

  var when = nextDayText(saved);
  flash = "✅ Saved. <b>" + esc(saved.name) + "</b> — " + esc(moveMeta(saved)) +
          (when ? ", next on <b>" + esc(when) + "</b>." : ". No days picked yet — tap it when you're ready.");

  if (addAnother){
    // Straight into a fresh, empty one, keeping the same counting style so a run
    // of similar moves is quick to type.
    editing = { id: newId(), name: "", kind: saved.kind, reps: saved.reps, sets: saved.sets,
                minutes: saved.minutes, days: [], isNew: true };
    drawBuild();
    var box = document.getElementById("edName"); if (box) box.focus();
  } else {
    editing = null;
    go("build");
  }
}
function deleteRoutine(){
  if (!confirm("Delete \"" + editing.name + "\"? This can't be undone.")) return;
  data.routines = data.routines.filter(function(r){ return r.id !== editing.id; });
  save(); editing = null; drawBuild();
}

/* ---------- support set + privacy note, on every page ---------- */
function drawSupport(){
  var liked = localStorage.getItem("mowes2_liked") === "1";
  var html =
    '<div class="support">' +
      '<button class="' + (liked ? 'liked' : '') + '" onclick="toggleLike()">' + (liked ? '❤️ Liked' : '🤍 Like') + '</button>' +
      '<a href="https://buymeacoffee.com/ermejia07c" target="_blank" rel="noopener">☕ Buy me a coffee</a>' +
    '</div>' +
    '<div class="trust">🔒 <b>No sign-up, no account, no email.</b><br>' +
    'Your data stays on your phone — it\'s never sent anywhere.<br>Free, and works offline.</div>';
  var slots = document.querySelectorAll(".support-slot");
  for (var i = 0; i < slots.length; i++) slots[i].innerHTML = html;
}
function toggleLike(){
  var liked = localStorage.getItem("mowes2_liked") === "1";
  try { localStorage.setItem("mowes2_liked", liked ? "0" : "1"); } catch(e){}
  drawSupport();
}

/* ---------- keep text safe inside the HTML we build ---------- */
function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}

/* ---------- start ---------- */
load();
drawSupport();
// ?fresh wipes everything, so the true first-time experience can be recorded.
if (location.search.indexOf("fresh") !== -1){
  try { localStorage.removeItem(KEY); localStorage.removeItem("mowes2_liked"); } catch(e){}
  data = blank();
}
document.getElementById("cover").classList.add("show");
</script>
