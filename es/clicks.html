<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MOWES — link clicks</title>
<meta name="robots" content="noindex">
<style>
  *{ box-sizing:border-box; margin:0; }
  body{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
    background:linear-gradient(180deg,#eef0ff,#e6e9ff);
    font-family:-apple-system,"SF Pro Rounded","Segoe UI",system-ui,sans-serif; color:#3a4066; }
  .card{ background:#fff; border-radius:24px; padding:30px 28px; text-align:center; width:300px;
    box-shadow:0 16px 44px rgba(60,64,102,.14); }
  .lbl{ font-size:13px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:#a9aede; }
  .num{ font-size:64px; font-weight:900; color:#5b6cff; margin:6px 0 2px; line-height:1; }
  .sub{ font-size:13.5px; font-weight:600; color:#8a90a8; line-height:1.4; }
  .btn{ margin-top:20px; border:0; cursor:pointer; background:#eef0fb; color:#5b6cff; font-weight:800;
    font-size:14px; padding:11px 18px; border-radius:12px; font-family:inherit; }
  .btn:active{ transform:scale(.98); }
  .note{ margin-top:16px; font-size:11.5px; color:#b6bad0; font-weight:600; line-height:1.5; }
</style>
</head>
<body>
  <div class="card">
    <div class="lbl">PIPES · desde YouTube</div>
    <div class="num" id="n">…</div>
    <div class="sub">tocaron el enlace de la descripción (go.html)</div>
    <div class="lbl" style="margin-top:22px">PIPES · desde TikTok</div>
    <div class="num" id="t">…</div>
    <div class="sub">escribieron la dirección corta (/es/t)</div>
    <button class="btn" id="refresh">↻ Refresh</button>
    <div class="note">🔒 An anonymous tally only — never who. The app itself stays untracked.</div>
  </div>
<script>
  // Two tallies, one per road in, so it is clear which platform actually sends
  // people — not just which one gets views.
  var GET  = "https://abacus.jasoncameron.dev/get/pipes-es-9k4z/biolink";
  var GETT = "https://abacus.jasoncameron.dev/get/pipes-es-9k4z/tiktok";
  // Each tally starts from where it stood when the link went live, so the
  // number on screen is real arrivals and not test hits.
  var BASE = { n: 0, t: 2 };   // t: two hits from testing the redirect
  function one(url, id){
    var el = document.getElementById(id); el.textContent = "…";
    var base = BASE[id] || 0;
    fetch(url + "?_=" + Date.now())
      .then(function(r){ return r.json(); })
      .then(function(d){ var v = (d && typeof d.value === "number") ? d.value : base; el.textContent = Math.max(0, v - base); })
      .catch(function(){ el.textContent = "0"; });
  }
  function load(){ one(GET, "n"); one(GETT, "t"); }
  document.getElementById("refresh").addEventListener("click", load);
  load();
</script>
</body>
</html>
