<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Abriendo PIPES…</title>
<meta name="robots" content="noindex">
<style>
  html,body{ margin:0; height:100%; }
  body{ display:flex; align-items:center; justify-content:center; text-align:center;
    background:linear-gradient(180deg,#eef0ff,#e6e9ff);
    font-family:-apple-system,"SF Pro Rounded","Segoe UI",system-ui,sans-serif; color:#5b6cff; }
  .msg{ font-size:20px; font-weight:800; }
  .msg .e{ font-size:34px; display:block; margin-bottom:8px; }
</style>
</head>
<body>
  <div class="msg"><span class="e">💪</span>Abriendo PIPES…</div>
<script>
  // The short counting link for YouTube. Its twin at /es/t is for TikTok.
  //
  // One letter says where someone came from: /es/t is TikTok, /es/y is
  // YouTube. Same length, own tally each, so it is clear which platform
  // actually sends people rather than which one collects views.
  //
  // Counts that someone arrived. Never who. The app itself has no tracking.
  (function(){
    var APP = "https://getermes.github.io/mowes/es/";
    var HIT = "https://abacus.jasoncameron.dev/hit/pipes-es-9k4z/youtube";
    var done = false;
    function go(){ if (done) return; done = true; location.replace(APP); }
    try { fetch(HIT, { keepalive:true, mode:"no-cors" }).then(go).catch(go); } catch(e){ go(); }
    setTimeout(go, 900); // safety: never leave anyone stuck
  })();
</script>
</body>
</html>
